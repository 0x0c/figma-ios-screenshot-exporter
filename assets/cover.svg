<svg width="1920" height="960" viewBox="0 0 1920 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1920" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2A5B"/>
      <stop offset="0.55" stop-color="#0A4FC8"/>
      <stop offset="1" stop-color="#0A8BFF"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F9FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#001436" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 92px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #FFFFFF; }
      .tag   { font: 400 40px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #CFE2FF; }
      .pill  { font: 600 30px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #0A4FC8; }
      .fname { font: 500 26px "SF Mono", ui-monospace, Menlo, monospace; fill: #4A6488; }
    </style>
  </defs>

  <rect width="1920" height="960" fill="url(#cbg)"/>

  <!-- soft glow accents -->
  <circle cx="1640" cy="170" r="280" fill="#3FA9FF" opacity="0.18"/>
  <circle cx="250" cy="820" r="240" fill="#1F6BFF" opacity="0.18"/>

  <!-- left: text -->
  <text class="title" x="140" y="430">iOS Screenshot</text>
  <text class="title" x="140" y="540">Exporter</text>
  <text class="tag" x="144" y="620">Export layers as App Store screenshots —</text>
  <text class="tag" x="144" y="672">auto-named by device family &amp; size.</text>

  <!-- feature pills -->
  <g>
    <rect x="144" y="724" width="250" height="64" rx="32" fill="#FFFFFF"/>
    <text class="pill" x="178" y="766">Auto naming</text>
    <rect x="414" y="724" width="200" height="64" rx="32" fill="#FFFFFF"/>
    <text class="pill" x="448" y="766">1x export</text>
    <rect x="634" y="724" width="240" height="64" rx="32" fill="#FFFFFF"/>
    <text class="pill" x="668" y="766">ZIP bundle</text>
  </g>

  <!-- right: device mockups -->
  <g filter="url(#sh)">
    <!-- back phone -->
    <g transform="translate(1300 250) rotate(-8)">
      <rect width="300" height="600" rx="44" fill="#0E2A55"/>
      <rect x="14" y="14" width="272" height="572" rx="32" fill="url(#shot)"/>
      <circle cx="150" cy="150" r="38" fill="#FFC24B"/>
      <path d="M40 470 L150 320 L220 400 L260 350 L300 470 Z" fill="#3E8BFF"/>
    </g>
    <!-- front phone -->
    <g transform="translate(1500 200) rotate(6)">
      <rect width="320" height="640" rx="48" fill="#0E2A55"/>
      <rect x="15" y="15" width="290" height="610" rx="34" fill="url(#shot)"/>
      <rect x="120" y="34" width="80" height="16" rx="8" fill="#0E2A55"/>
      <circle cx="160" cy="190" r="42" fill="#FFC24B"/>
      <path d="M40 520 L160 350 L235 440 L280 385 L320 520 Z" fill="#3E8BFF"/>
    </g>
  </g>

  <!-- filename chips -->
  <g>
    <rect x="1230" y="812" width="380" height="56" rx="14" fill="#FFFFFF"/>
    <text class="fname" x="1256" y="848">en-US_iPhone69_01.png</text>
    <rect x="1640" y="812" width="150" height="56" rx="14" fill="#FFC24B"/>
    <text class="pill" x="1668" y="850" fill="#5A3D00">.zip</text>
  </g>
</svg>
